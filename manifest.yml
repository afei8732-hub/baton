app:
  id: ari:cloud:ecosystem::app/3f0c5f3e-9a1c-4c2f-9d67-5b1a2c7e8d41
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  licensing:
    enabled: false

modules:
  jira:issuePanel:
    - key: baton-issue-panel
      resource: main
      resolver:
        function: resolver
      title: Baton handoff brief
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      tooltip: What the next owner needs to know, assembled from this issue, its docs and its history.

  jira:issueAction:
    - key: baton-issue-action
      resource: main
      resolver:
        function: resolver
      title: Baton - hand off with context

  jira:globalPage:
    - key: baton-handoff-health-page
      resource: main
      resolver:
        function: resolver
      title: Baton handoff health
      icon: https://developer.atlassian.com/platform/forge/images/icons/global-page-icon.svg

  rovo:agent:
    - key: baton-agent
      name: Baton handoff agent
      description: Answers "what do I need to know before I take this on?" for a Jira issue, using recorded decisions, past incidents and the people who hold the detail.
      prompt: resource:agent-resource;prompts/agent-prompt.md
      conversationStarters:
        - What do I need to know before I take over PAY-412?
        - Which decisions about this issue have been superseded?
        - Who is the only source for the retry policy?
        - Show our handoff health for this project
      actions:
        - baton-handoff-brief
        - baton-handoff-health

  action:
    - key: baton-handoff-brief
      name: Build a handoff brief
      function: handoffBriefAction
      actionVerb: GET
      description: |
        Assemble a handoff brief for a Jira issue. Use this when a user asks what
        they need to know before picking up, taking over, or reviewing an issue.
        Returns the load-bearing decisions, documents, incidents, knowledge gaps
        and a confidence score.
      inputs:
        issueKey:
          title: Jira issue key
          type: string
          required: true
          description: The issue to brief, for example PAY-412.
    - key: baton-handoff-health
      name: Report handoff health
      function: handoffHealthAction
      actionVerb: GET
      description: |
        Report how well work was handed over recently. Use this when a user asks
        about handoff quality, missing context, or which issues were picked up
        without enough context.
      inputs:
        limit:
          title: Number of handoffs
          type: integer
          required: false
          description: How many recent handoffs to include, 1 to 25.

  rovo:mcp:
    - key: baton-mcp
      name: Baton context tools
      tools:
        - baton-handoff-brief
        - baton-handoff-health

  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: handoffBriefAction
      handler: resolvers/index.handoffBriefAction
    - key: handoffHealthAction
      handler: resolvers/index.handoffHealthAction

resources:
  - key: main
    path: static/baton
  - key: agent-resource
    path: resource/agent

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:confluence-content.all
    - storage:app
